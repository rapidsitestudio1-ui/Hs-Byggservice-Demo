[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    # Bilderna har inte innehallshash i filnamnet – optimize-images.mjs skriver
    # over samma namn – sa immutable i ett ar skulle lasa fast gamla foton.
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    # Stilmallen har inget innehallshash i filnamnet, sa en blind cache pa en
    # vecka gor att aterkommande besokare far en gammal design. Netlify skickar
    # ETag: med must-revalidate fragar webblasaren varje gang och far 304 om
    # inget andrats — nastan ingen trafik, men andringar syns direkt.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    # Samma skal som for /css/* ovan.
    Cache-Control = "public, max-age=0, must-revalidate"
